[env:esp32-c3-devkitm-1]
platform = espressif32
board = esp32-c3-devkitm-1
framework = espidf
monitor_speed = 115200

# Megmondja a PlatformIO-nak, hogy figyelje az sdkconfig változásait
board_build.esp-idf.sdkconfig_defaults = sdkconfig.defaults

# Auto-reconnect és DTR/RTS logika a natív USBCDC-hez
monitor_dtr = 0
monitor_rts = 0